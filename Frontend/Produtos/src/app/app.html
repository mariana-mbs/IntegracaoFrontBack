<main class="container">
  <header>
    <p class="subtitulo">CATÁLOGO</p>
    <h1>Produtos</h1>
    <p>Cadastre e gerencie seus produtos.</p>
  </header>

  <section class="cartao">
    <h2>{{ editando ? 'Editar produto' : 'Novo produto' }}</h2>

    <form #formulario="ngForm" (ngSubmit)="salvar()">
      <label for="nome">Nome</label>
      <input
        id="nome"
        name="nome"
        [(ngModel)]="produtoAtual.nome"
        required
        maxlength="100"
        placeholder="Ex.: Teclado"
      />

      <label for="preco">Preço</label>
      <input
        id="preco"
        name="preco"
        type="number"
        [(ngModel)]="produtoAtual.preco"
        required
        min="0.01"
        max="1000"
        step="0.01"
        placeholder="Ex.: 150"
      />

      <div class="botoes">
        <button type="submit" [disabled]="formulario.invalid">
          {{ editando ? 'Salvar alterações' : 'Cadastrar produto' }}
        </button>

        <button
          *ngIf="editando"
          type="button"
          class="botao-secundario"
          (click)="cancelarEdicao()"
        >
          Cancelar
        </button>
      </div>
    </form>

    <p *ngIf="mensagem" class="mensagem">{{ mensagem }}</p>
    <p *ngIf="erro" class="erro">{{ erro }}</p>
  </section>

  <section class="lista">
    <h2>Produtos cadastrados ({{ produtos.length }})</h2>

    <p *ngIf="produtos.length === 0" class="vazio">
      Nenhum produto cadastrado.
    </p>

    <table *ngIf="produtos.length > 0">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Preço</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let produto of produtos">
          <td>{{ produto.nome }}</td>
          <td>R$ {{ produto.preco }}</td>
          <td class="acoes">
            <button type="button" class="botao-editar" (click)="editar(produto)">
              Editar
            </button>
            <button type="button" class="botao-excluir" (click)="excluir(produto)">
              Excluir
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</main>
